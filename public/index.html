        <h1>Sistema de Média</h1>
        <h2>Desenvolvimento Web III</h2>

        <p>Informe as notas pela URL:</p>

        <code>/media?p1=[NOTA-P1]&p2=[NOTA-P2]</code>

        <p>Exemplo:</p>

        <code>/media?p1=7.5&amp;p2=5.0</code>
    </main>
